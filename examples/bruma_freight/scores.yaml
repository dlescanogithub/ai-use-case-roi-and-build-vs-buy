# [EST] illustrative scores. Replace with your own.
illustrative: true
case_id: bruma_freight
options:
  - id: build
    label: Build in-house
    cells:
      control:
        score: 5
        estimate: true
        marker: "[EST] illustrative"
        rationale: The team would own the prompts, the tools, and the tenancy, and could change the workflow without a vendor release.
      time_to_value:
        score: 2
        estimate: true
        marker: "[EST] illustrative"
        rationale: A careful internal first version is slower than a hosted pilot, and the desk wants a human review loop before drafts are trusted.
      tco_3y:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: Year-one engineering is heavy. Later years are maintenance, review, and a small run cost, so the cash picture against seats is mixed.
      vendor_risk:
        score: 5
        estimate: true
        marker: "[EST] illustrative"
        rationale: There is no vendor who can raise the price or shut the product down. The remaining risk is hiring and continuity of the internal team.
      security_compliance:
        score: 4
        estimate: true
        marker: "[EST] illustrative"
        rationale: Ticket text stays in the company's own tenancy in these fictional case notes. The team still has to run access control and retention.
      maintainability:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: The same small team would own evals, prompts, and breakage. That is workable, and it is also easy to under-staff.
      extensibility:
        score: 5
        estimate: true
        marker: "[EST] illustrative"
        rationale: New ticket types and internal tools can be added in the team's own repository when the desk asks for them.
      exit_cost:
        score: 5
        estimate: true
        marker: "[EST] illustrative"
        rationale: Stopping this approach means keeping the code and the eval set. There is no contract exit fee in the model.
  - id: vendor_a
    label: Vendor A - Harborline Desk
    cells:
      control:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: Harborline Desk allows workflow configuration and transcript export. Core routing still follows the vendor product cycle.
      time_to_value:
        score: 4
        estimate: true
        marker: "[EST] illustrative"
        rationale: A hosted pilot can start in weeks because the channel and the agent shell already exist in the fictional product.
      tco_3y:
        score: 4
        estimate: true
        marker: "[EST] illustrative"
        rationale: Seat licenses dominate the modeled cash. Usage stays small at this volume, and integration is a one-time cost.
      vendor_risk:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: These fictional case notes assume an annual renewal and an 8 percent price-increase assumption. A low assumption is an exposure.
      security_compliance:
        score: 4
        estimate: true
        marker: "[EST] illustrative"
        rationale: These fictional case notes claim SSO, an audit log, and a no-training clause. This score records that claim, not a certification.
      maintainability:
        score: 4
        estimate: true
        marker: "[EST] illustrative"
        rationale: The vendor runs the platform. The internal team still owns the review queue and the acceptance tests.
      extensibility:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: Extensions stay inside the vendor tool model. Unusual internal systems need their own integration project.
      exit_cost:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: Transcripts are exportable in these fictional case notes. Rebuilding the workflow elsewhere is still a project, with a modeled exit fee.
  - id: vendor_b
    label: Vendor B - Quayloop
    cells:
      control:
        score: 2
        estimate: true
        marker: "[EST] illustrative"
        rationale: Quayloop is the most closed of the three options. Routing rules live in a proprietary format in these fictional case notes.
      time_to_value:
        score: 5
        estimate: true
        marker: "[EST] illustrative"
        rationale: It is the fastest fictional pilot. Little integration is required to cover one narrow ticket type.
      tco_3y:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: The seat price is lower, the usage price per run is higher, and the modeled exit fee is large.
      vendor_risk:
        score: 2
        estimate: true
        marker: "[EST] illustrative"
        rationale: A single vendor, a 12 percent price-increase assumption, and a thin export path concentrate the risk.
      security_compliance:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: These fictional case notes say customer text may be used to improve a shared model. That is a weak fit for shipment exceptions.
      maintainability:
        score: 3
        estimate: true
        marker: "[EST] illustrative"
        rationale: Operations stay simple while the product matches the desk. Divergence becomes a support contract.
      extensibility:
        score: 2
        estimate: true
        marker: "[EST] illustrative"
        rationale: New processes wait on the vendor feature list. The desk cannot add an internal tool on its own.
      exit_cost:
