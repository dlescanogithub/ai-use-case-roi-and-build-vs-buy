name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Types
        run: make typecheck
      - name: Tests
        run: make test
      - name: Eval gate
        run: make eval
      - name: Secret scan
        run: make secrets
      - name: Forced regression must fail
        run: |
          set +e
          make eval-regression
          status=$?
          set -e
          echo "eval-regression exit code: $status"
          if [ "$status" -eq 0 ]; then
            echo "expected the forced-regression gate to fail"
            exit 1
          fi
          echo "forced regression failed as required"
