[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-use-case-roi-and-build-vs-buy"
version = "0.2.1"
description = "Illustrative ROI model and build-vs-buy decision kit. Inputs are assumptions unless a measurement names a date and a command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Lescano" }]
keywords = ["roi", "build-vs-buy", "tco", "sensitivity", "evals"]
dependencies = [
  "PyYAML>=6.0.1",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "types-openpyxl>=3.1.5",
  "pre-commit>=3.8",
]

[project.scripts]
roi-and-build-vs-buy = "roi_and_build_vs_buy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roi_and_build_vs_buy = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["roi_and_build_vs_buy"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roi_and_build_vs_buy"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=roi_and_build_vs_buy --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["roi_and_build_vs_buy"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
]
