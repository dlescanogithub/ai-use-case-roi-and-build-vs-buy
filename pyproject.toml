[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-use-case-roi-model"
version = "0.1.0"
description = "Simulated ROI, payback and sensitivity model for an AI use case. Inputs are assumptions, not measurements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Lescano" }]
keywords = ["roi", "sensitivity", "evals", "portfolio"]
dependencies = [
  "PyYAML>=6.0.1",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "types-openpyxl>=3.1.5",
  "pre-commit>=3.8",
]

[project.scripts]
roi-model = "roi_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roi_model"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=roi_model --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["roi_model"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
]
